<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Build e Run: sprintx e runx, as duas metades do metodo Expx">
  <rect width="900" height="300" rx="12" fill="#0d1117"/>
  <text x="450" y="38" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">O metodo Expx tem duas metades</text>

  <!-- sprintx -->
  <rect x="40" y="64" width="368" height="150" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="68" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700" fill="#a371f7">sprintx</text>
  <rect x="196" y="80" width="58" height="24" rx="12" fill="#a371f7"/>
  <text x="225" y="97" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#0d1117">BUILD</text>
  <text x="68" y="128" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#e6edf3">Feature nova, planejada do zero</text>
  <text x="68" y="152" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#8b949e">Entrada: uma ideia, um requisito</text>
  <text x="68" y="172" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#8b949e">F1 ... F6  ingestao ate execucao</text>
  <text x="68" y="192" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#8b949e">Saida: a feature entregue</text>

  <!-- runx -->
  <rect x="492" y="64" width="368" height="150" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <text x="520" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700" fill="#f0883e">runx</text>
  <rect x="620" y="80" width="46" height="24" rx="12" fill="#f0883e"/>
  <text x="643" y="97" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#0d1117">RUN</text>
  <text x="520" y="128" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#e6edf3">Ocorrencia num sistema em producao</text>
  <text x="520" y="152" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#8b949e">Entrada: um chamado, um relato</text>
  <text x="520" y="172" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#8b949e">E1 ... E5  investigacao ate relatorio</text>
  <text x="520" y="192" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#8b949e">Saida: a ocorrencia encerrada</text>

  <!-- ponte -->
  <line x1="408" y1="139" x2="492" y2="139" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="450" cy="139" r="21" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="450" y="144" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="700" fill="#8b949e">Expx</text>

  <!-- contratos compartilhados -->
  <rect x="40" y="234" width="820" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="254" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#e6edf3">Mesmos contratos: base antes do plano · sprint - fase - task · TDD com 2 testes por task</text>
  <text x="450" y="271" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Muda o gatilho e o tamanho. Nunca o rigor.</text>
</svg>
