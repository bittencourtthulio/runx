<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="E4: a IA troca de papel, valida e não corrige nada. Achado de severidade ALTA devolve ao E3.">
<title>E4 da runx: QA independente, valida e não corrige nada</title>
<style>
.qa-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.qa-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.qa-h{font-size:20px;font-weight:600;fill:#e6edf3}
.qa-sub{font-size:13px;fill:#8b949e}
.qa-it{font-size:13px;fill:#8b949e}
.qa-cap{font-size:12px;font-weight:600;fill:#8b949e}
.qa-foot{font-size:13px;fill:#8b949e}
.a{animation:qaA 14s linear infinite}.b{animation:qaB 14s linear infinite}
@keyframes qaA{0%,41%{opacity:0}44%,86%{opacity:1}89%,100%{opacity:0}}
@keyframes qaB{0%,88%{opacity:0}91%,98%{opacity:1}100%{opacity:0}}
@keyframes qaTick1{0%,10%{opacity:0;transform:scale(.4)}13%{opacity:1;transform:scale(1.15)}15%,96%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes qaTick2{0%,17%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.15)}22%,96%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes qaTick3{0%,24%{opacity:0;transform:scale(.4)}27%{opacity:1;transform:scale(1.15)}29%,96%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes qaTick4{0%,31%{opacity:0;transform:scale(.4)}34%{opacity:1;transform:scale(1.15)}36%,96%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes qaFail5{0%,38%{opacity:0;transform:scale(.4)}41%{opacity:1;transform:scale(1.15)}43%,86%{opacity:1;transform:scale(1)}89%,100%{opacity:0;transform:scale(1)}}
@keyframes qaTick5{0%,88%{opacity:0;transform:scale(.4)}91%{opacity:1;transform:scale(1.15)}93%,98%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.4)}}
@keyframes qaHi5{0%,38%{opacity:0}41%,86%{opacity:1}89%,100%{opacity:0}}
@keyframes qaBack{0%,48%{opacity:0}52%{opacity:1}86%{opacity:1}89%,100%{opacity:0}}
</style>
<defs>
<g id="qa-ok"><circle r="9" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.55"/><path d="M-3.6 0.2 L-1 2.8 L3.8 -2.4" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="qa-bad"><circle r="9" fill="#f85149" fill-opacity="0.16" stroke="#f85149" stroke-opacity="0.55"/><path d="M-3.2 -3.2 L3.2 3.2 M3.2 -3.2 L-3.2 3.2" stroke="#f85149" stroke-width="2" stroke-linecap="round"/></g>
<g id="qa-dot"><circle r="9" fill="#161b22" stroke="#30363d"/></g>
<filter id="qa-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<rect x="0.5" y="0.5" width="999" height="389" rx="16" fill="#0d1117" stroke="#30363d"/>
<text class="qa-sans qa-h" x="36" y="44">A IA troca de papel</text>
<text class="qa-sans qa-sub" x="36" y="66">no E4 ela valida, não implementa, e <tspan fill="#e6edf3">não corrige nada</tspan> do que encontrar</text>

<!-- checklist -->
<rect x="36.5" y="92.5" width="554" height="212" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="qa-sans qa-cap" x="60" y="120">O QUE O E4 CONFERE</text>
<line x1="36" y1="132" x2="590" y2="132" stroke="#30363d"/>

<text class="qa-sans qa-it" x="86" y="160">o teste de regressão realmente falhava antes</text>
<g transform="translate(62,155)"><use href="#qa-dot"/></g>
<g transform="translate(62,155)"><g style="animation:qaTick1 14s linear infinite;transform-box:fill-box;transform-origin:center" opacity="0"><use href="#qa-ok"/></g></g>

<text class="qa-sans qa-it" x="86" y="190">cada task tem os dois testes</text>
<g transform="translate(62,185)"><use href="#qa-dot"/></g>
<g transform="translate(62,185)"><g style="animation:qaTick2 14s linear infinite;transform-box:fill-box;transform-origin:center" opacity="0"><use href="#qa-ok"/></g></g>

<text class="qa-sans qa-it" x="86" y="220">existe teste que passaria com a implementação errada?</text>
<g transform="translate(62,215)"><use href="#qa-dot"/></g>
<g transform="translate(62,215)"><g style="animation:qaTick3 14s linear infinite;transform-box:fill-box;transform-origin:center" opacity="0"><use href="#qa-ok"/></g></g>

<text class="qa-sans qa-it" x="86" y="250">a suíte inteira passa</text>
<g transform="translate(62,245)"><use href="#qa-dot"/></g>
<g transform="translate(62,245)"><g style="animation:qaTick4 14s linear infinite;transform-box:fill-box;transform-origin:center" opacity="0"><use href="#qa-ok"/></g></g>

<rect x="48" y="264" width="530" height="30" rx="8" fill="#f85149" fill-opacity="0.08" opacity="0" style="animation:qaHi5 14s linear infinite"/>
<text class="qa-sans qa-it" x="86" y="284">o diff bate com os arquivos que a investigação autorizou</text>
<g transform="translate(62,279)"><use href="#qa-dot"/></g>
<g transform="translate(62,279)"><g style="animation:qaFail5 14s linear infinite;transform-box:fill-box;transform-origin:center" opacity="0"><use href="#qa-bad"/></g></g>
<g transform="translate(62,279)"><g style="animation:qaTick5 14s linear infinite;transform-box:fill-box;transform-origin:center" opacity="0"><use href="#qa-ok"/></g></g>

<!-- veredito -->
<rect x="626.5" y="92.5" width="337" height="212" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="qa-sans qa-cap" x="650" y="120">VEREDITO DE UMA LINHA</text>
<line x1="626" y1="132" x2="963" y2="132" stroke="#30363d"/>

<g class="b" opacity="0">
<rect x="650" y="152" width="290" height="52" rx="10" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950"/>
<rect x="650" y="152" width="290" height="52" rx="10" fill="#3fb950" filter="url(#qa-glow)" opacity="0.25"/>
<g transform="translate(682,178)"><use href="#qa-ok"/></g>
<text class="qa-mono" x="708" y="184" font-size="19" font-weight="700" fill="#3fb950">APROVADO</text>
<text class="qa-sans qa-it" x="650" y="232">segue para o <tspan class="qa-mono" fill="#e6edf3">E5</tspan> — dois relatórios e fechamento</text>
</g>

<g class="a">
<rect x="650" y="152" width="290" height="52" rx="10" fill="#f85149" fill-opacity="0.10" stroke="#f85149"/>
<rect x="650" y="152" width="290" height="52" rx="10" fill="#f85149" filter="url(#qa-glow)" opacity="0.25"/>
<g transform="translate(682,178)"><use href="#qa-bad"/></g>
<text class="qa-mono" x="708" y="184" font-size="19" font-weight="700" fill="#f85149">REPROVADO</text>
<text class="qa-sans qa-it" x="650" y="232">achado de <tspan fill="#f85149" font-weight="700">severidade ALTA</tspan></text>
<text class="qa-sans qa-it" x="650" y="254">arquivo fora do escopo declarado</text>
</g>

<rect x="650" y="266" width="150" height="24" rx="12" fill="#f0883e" fill-opacity="0.12" stroke="#f0883e" stroke-opacity="0.45"/>
<g transform="translate(666,278)"><rect x="-4.5" y="-1" width="9" height="7" rx="1.4" fill="#f0883e"/><path d="M-2.8 -1v-2.2a2.8 2.8 0 0 1 5.6 0V-1" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round"/></g>
<text class="qa-sans" x="686" y="282" font-size="12" font-weight="600" fill="#f0883e">não corrige nada</text>

<!-- devolução ao E3 -->
<g opacity="0" style="animation:qaBack 14s linear infinite">
<path d="M626 330 H300" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M306 324 L299 330 L306 336" fill="none" stroke="#f85149" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="196" y="316" width="96" height="28" rx="14" fill="#f85149" fill-opacity="0.12" stroke="#f85149"/>
<text class="qa-sans" x="244" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#f85149">volta ao E3</text>
<text class="qa-sans" x="648" y="334" font-size="12" fill="#8b949e">quem implementa não aprova</text>
</g>

<line x1="36" y1="352" x2="964" y2="352" stroke="#21262d"/>
<text class="qa-sans qa-foot" x="36" y="376">O E4 roda em contexto próprio, para que o julgamento não seja contaminado por quem produziu o trabalho. <tspan fill="#e6edf3">Nunca cabe ao E4 corrigir.</tspan></text>
</svg>
