<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Sessões paralelas: worktree por ocorrência, reivindicação de task pelo rastro e árvore limpa antes da suíte.">
<title>Sessões paralelas na runx: três mecanismos de isolamento</title>
<style>
.sp-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.sp-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:11.5px}
.sp-h{font-size:20px;font-weight:600;fill:#e6edf3}
.sp-sub{font-size:13px;fill:#8b949e}
.sp-n{font-size:11px;font-weight:700;fill:#f0883e}
.sp-t{font-size:14px;font-weight:600;fill:#e6edf3}
.sp-d{font-size:12px;fill:#8b949e}
.sp-foot{font-size:13px;fill:#8b949e}
@keyframes spSplit{0%,10%{opacity:0;stroke-dashoffset:130}22%,92%{opacity:1;stroke-dashoffset:0}98%,100%{opacity:0;stroke-dashoffset:0}}
@keyframes spWt{0%,22%{opacity:0;transform:translateX(-10px)}30%,92%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}
@keyframes spWt2{0%,30%{opacity:0;transform:translateX(-10px)}38%,92%{opacity:1;transform:none}98%,100%{opacity:0;transform:none}}
@keyframes spScan{0%,14%{opacity:0;transform:translateY(0)}20%{opacity:1;transform:translateY(0)}38%{opacity:1;transform:translateY(24px)}44%{opacity:1;transform:translateY(24px)}56%,92%{opacity:1;transform:translateY(48px)}98%,100%{opacity:0;transform:translateY(48px)}}
@keyframes spSkip{0%,40%{opacity:0;transform:scale(.7)}46%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}
@keyframes spDirty{0%,16%{opacity:0}22%,58%{opacity:1}64%,100%{opacity:0}}
@keyframes spHold{0%,24%{opacity:0}30%,58%{opacity:1}64%,100%{opacity:0}}
@keyframes spClean{0%,62%{opacity:0}68%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes spRun{0%,70%{opacity:0}76%,92%{opacity:1}98%,100%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="999" height="389" rx="16" fill="#0d1117" stroke="#30363d"/>
<text class="sp-sans sp-h" x="36" y="44">Sessões paralelas no mesmo projeto</text>
<text class="sp-sans sp-sub" x="36" y="66">várias sessões, do mesmo harness ou de harnesses diferentes, sem que uma leve o trabalho não salvo da outra</text>

<!-- 1 -->
<rect x="36.5" y="92.5" width="296" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="60" cy="116" r="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.5"/>
<text class="sp-sans sp-n" x="60" y="120" text-anchor="middle">1</text>
<text class="sp-sans sp-t" x="80" y="120">Worktree por ocorrência</text>
<text class="sp-sans sp-d" x="60" y="146">regra 16 — cada ocorrência nasce isolada</text>
<line x1="36" y1="160" x2="332" y2="160" stroke="#30363d"/>
<rect x="128" y="176" width="112" height="28" rx="8" fill="#21262d" stroke="#30363d"/>
<text class="sp-mono" x="184" y="194" text-anchor="middle" style="fill:#e6edf3">checkout principal</text>
<path d="M184 208 V228 H96 V244" fill="none" stroke="#f0883e" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="130" style="animation:spSplit 12s linear infinite"/>
<path d="M184 208 V228 H272 V244" fill="none" stroke="#f0883e" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="130" style="animation:spSplit 12s linear infinite"/>
<g opacity="0" style="animation:spWt 12s linear infinite">
<rect x="52" y="246" width="88" height="52" rx="8" fill="#21262d" stroke="#f0883e" stroke-opacity="0.45"/>
<text class="sp-sans" x="96" y="264" text-anchor="middle" font-size="11.5" style="fill:#f0883e">sessão A</text>
<text class="sp-mono" x="96" y="280" text-anchor="middle" style="fill:#8b949e">OC-0142</text>
<text class="sp-mono" x="96" y="293" text-anchor="middle" style="fill:#6e7681">worktree</text>
</g>
<g opacity="0" style="animation:spWt2 12s linear infinite">
<rect x="228" y="246" width="88" height="52" rx="8" fill="#21262d" stroke="#f0883e" stroke-opacity="0.45"/>
<text class="sp-sans" x="272" y="264" text-anchor="middle" font-size="11.5" style="fill:#f0883e">sessão B</text>
<text class="sp-mono" x="272" y="280" text-anchor="middle" style="fill:#8b949e">OC-0151</text>
<text class="sp-mono" x="272" y="293" text-anchor="middle" style="fill:#6e7681">worktree</text>
</g>

<!-- 2 -->
<rect x="352.5" y="92.5" width="296" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="376" cy="116" r="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.5"/>
<text class="sp-sans sp-n" x="376" y="120" text-anchor="middle">2</text>
<text class="sp-sans sp-t" x="396" y="120">Reivindicação pelo rastro</text>
<text class="sp-sans sp-d" x="376" y="146">ninguém reabre task que outra sessão segura</text>
<line x1="352" y1="160" x2="648" y2="160" stroke="#30363d"/>
<rect x="376" y="176" width="248" height="24" rx="6" fill="#21262d" stroke="#30363d"/>
<text class="sp-mono" x="388" y="192"><tspan style="fill:#8b949e">T-01.02  </tspan><tspan style="fill:#3fb950">concluida</tspan></text>
<rect x="376" y="204" width="248" height="24" rx="6" fill="#d29922" fill-opacity="0.10" stroke="#d29922" stroke-opacity="0.45"/>
<text class="sp-mono" x="388" y="220"><tspan style="fill:#8b949e">T-01.03  </tspan><tspan style="fill:#d29922">em_andamento · sessão A</tspan></text>
<rect x="376" y="232" width="248" height="24" rx="6" fill="#21262d" stroke="#30363d"/>
<text class="sp-mono" x="388" y="248"><tspan style="fill:#8b949e">T-01.05  </tspan><tspan style="fill:#6e7681">pendente · paralelizavel</tspan></text>
<g opacity="0" style="animation:spScan 12s linear infinite">
<rect x="368" y="176" width="4" height="24" rx="2" fill="#f0883e"/>
</g>
<g transform="translate(636,216)" opacity="0"><g style="animation:spSkip 12s linear infinite;transform-box:fill-box;transform-origin:center">
<circle r="9" fill="#d29922" fill-opacity="0.18" stroke="#d29922" stroke-opacity="0.6"/>
<path d="M-4 -3 L2 -3 M-4 0 L2 0 M-4 3 L2 3" stroke="#d29922" stroke-width="1.6" stroke-linecap="round"/>
</g></g>
<text class="sp-sans" x="376" y="282" font-size="11.5" style="fill:#6e7681">a sessão B pula a T-01.03 e assume a T-01.05</text>
<text class="sp-sans" x="376" y="300" font-size="11.5" style="fill:#6e7681">— o rastro é a fonte, não a memória do modelo</text>

<!-- 3 -->
<rect x="668.5" y="92.5" width="295" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="692" cy="116" r="10" fill="#f0883e" fill-opacity="0.14" stroke="#f0883e" stroke-opacity="0.5"/>
<text class="sp-sans sp-n" x="692" y="120" text-anchor="middle">3</text>
<text class="sp-sans sp-t" x="712" y="120">Árvore limpa antes da suíte</text>
<text class="sp-sans sp-d" x="692" y="146">a suíte inteira e o QA esperam a árvore</text>
<line x1="668" y1="160" x2="963" y2="160" stroke="#30363d"/>
<text class="sp-mono" x="692" y="186" style="fill:#6e7681">git status --porcelain</text>
<g opacity="0" style="animation:spDirty 12s linear infinite">
<rect x="692" y="196" width="248" height="24" rx="6" fill="#f85149" fill-opacity="0.10" stroke="#f85149" stroke-opacity="0.4"/>
<text class="sp-mono" x="704" y="212"><tspan style="fill:#f85149"> M </tspan><tspan style="fill:#8b949e">src/relatorios/pdf.ts</tspan></text>
</g>
<g opacity="0" style="animation:spHold 12s linear infinite">
<rect x="692" y="230" width="168" height="26" rx="13" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.5"/>
<text class="sp-sans" x="776" y="247" text-anchor="middle" font-size="12" font-weight="600" style="fill:#d29922">suíte segurada</text>
<text class="sp-sans" x="692" y="278" font-size="11.5" style="fill:#6e7681">arquivo sujo fora do escopo declarado</text>
</g>
<g opacity="0" style="animation:spClean 12s linear infinite">
<rect x="692" y="196" width="248" height="24" rx="6" fill="#3fb950" fill-opacity="0.08" stroke="#3fb950" stroke-opacity="0.35"/>
<text class="sp-mono" x="704" y="212" style="fill:#3fb950">árvore limpa</text>
</g>
<g opacity="0" style="animation:spRun 12s linear infinite">
<rect x="692" y="230" width="168" height="26" rx="13" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.5"/>
<text class="sp-sans" x="776" y="247" text-anchor="middle" font-size="12" font-weight="600" style="fill:#3fb950">suíte inteira roda</text>
<text class="sp-sans" x="692" y="278" font-size="11.5" style="fill:#6e7681">nenhuma task de outra sessão em andamento</text>
</g>

<line x1="36" y1="340" x2="964" y2="340" stroke="#21262d"/>
<text class="sp-sans sp-foot" x="36" y="366">Sem isolamento, um <tspan class="sp-mono" style="fill:#e6edf3">stash</tspan> de uma sessão levaria o trabalho não salvo de outra, e a suíte reprovaria por código que outra sessão está no meio de mudar.</text>
</svg>
