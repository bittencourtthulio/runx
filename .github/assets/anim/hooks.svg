<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Hooks: scripts determinísticos que o harness executa. Aviso deixa passar com marca; bloqueio barra. Todo hook de método nasce em aviso.">
<title>Hooks da runx: a regra que não depende de o modelo lembrar</title>
<style>
.hk-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.hk-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.hk-h{font-size:20px;font-weight:600;fill:#e6edf3}
.hk-sub{font-size:13px;fill:#8b949e}
.hk-cap{font-size:11.5px;font-weight:700}
.hk-t{font-size:13px;font-weight:600;fill:#e6edf3}
.hk-d{font-size:12px;fill:#8b949e}
.hk-foot{font-size:13px;fill:#8b949e}
@keyframes hkFlow{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
@keyframes hkPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes hkMark{0%,30%{opacity:0;transform:scale(.6)}36%{opacity:1;transform:scale(1.12)}40%,88%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(1)}}
@keyframes hkBar{0%,30%{opacity:0;transform:scaleY(.2)}37%,88%{opacity:1;transform:scaleY(1)}94%,100%{opacity:0;transform:scaleY(1)}}
@keyframes hkTok{0%,6%{opacity:0;transform:translateX(0)}12%{opacity:1;transform:translateX(0)}30%,88%{opacity:1;transform:translateX(180px)}94%,100%{opacity:0;transform:translateX(180px)}}
@keyframes hkTokB{0%,6%{opacity:0;transform:translateX(0)}12%{opacity:1;transform:translateX(0)}26%{opacity:1;transform:translateX(112px)}31%,88%{opacity:1;transform:translateX(104px)}94%,100%{opacity:0;transform:translateX(104px)}}
</style>
<rect x="0.5" y="0.5" width="999" height="429" rx="16" fill="#0d1117" stroke="#30363d"/>
<text class="hk-sans hk-h" x="36" y="44">A regra que não depende de o modelo lembrar</text>
<text class="hk-sans hk-sub" x="36" y="66">hook é script determinístico: roda sempre, porque quem executa é o harness, não o modelo</text>

<!-- pipeline -->
<rect x="36.5" y="92.5" width="216" height="62" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="hk-sans hk-cap" x="56" y="116" style="fill:#6e7681">CHAMADA DE FERRAMENTA</text>
<text class="hk-mono" x="56" y="138" font-size="12.5" style="fill:#e6edf3">Write src/frete/calculo.ts</text>

<path d="M262 124 H300" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6" style="animation:hkFlow 1.2s linear infinite"/>
<path d="M294 118 L301 124 L294 130" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="310.5" y="92.5" width="196" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity="0.5"/>
<text class="hk-sans hk-cap" x="330" y="116" style="fill:#f0883e">DESPACHANTE ÚNICO</text>
<text class="hk-mono" x="330" y="138" font-size="12.5" style="fill:#8b949e">um processo, não nove</text>

<path d="M516 124 H554" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6" style="animation:hkFlow 1.2s linear infinite"/>
<path d="M548 118 L555 124 L548 130" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="564.5" y="92.5" width="399" height="62" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="hk-sans hk-cap" x="584" y="116" style="fill:#6e7681">VERIFICAÇÕES EM SEQUÊNCIA</text>
<g>
<rect x="578" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0s infinite"/>
<rect x="612" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.1s infinite"/>
<rect x="646" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.2s infinite"/>
<rect x="680" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.3s infinite"/>
<rect x="714" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.4s infinite"/>
<rect x="748" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.5s infinite"/>
<rect x="782" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.6s infinite"/>
<rect x="816" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.7s infinite"/>
<rect x="850" y="126" width="30" height="14" rx="3" fill="#f0883e" fill-opacity="0.3" style="animation:hkPulse 1.6s ease-in-out 0.8s infinite"/>
</g>
<text class="hk-sans" x="950" y="138" text-anchor="end" font-size="11.5" style="fill:#6e7681">&lt; 200 ms</text>

<text class="hk-sans hk-d" x="36" y="180">Cada <tspan class="hk-mono" style="fill:#e6edf3">python3</tspan> custa cerca de 30 ms só para subir — nove processos separados estourariam o orçamento de 200 ms por chamada de ferramenta.</text>

<!-- modo aviso -->
<rect x="36.5" y="204.5" width="460" height="164" rx="10" fill="#161b22" stroke="#d29922" stroke-opacity="0.45"/>
<rect x="60" y="222" width="76" height="22" rx="11" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.5"/>
<text class="hk-sans hk-cap" x="98" y="237" text-anchor="middle" style="fill:#d29922">modo aviso</text>
<text class="hk-sans hk-d" x="148" y="237">o padrão de nascimento de todo hook de método</text>
<line x1="36" y1="256" x2="496" y2="256" stroke="#30363d"/>
<text class="hk-mono" x="60" y="282" font-size="12" style="fill:#8b949e">escopo-da-ocorrencia.py</text>
<line x1="60" y1="316" x2="470" y2="316" stroke="#21262d" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="232" y="296" width="6" height="40" rx="3" fill="#d29922" fill-opacity="0.45"/>
<g style="animation:hkTok 11s linear infinite" opacity="0">
<rect x="60" y="302" width="126" height="28" rx="8" fill="#21262d" stroke="#d29922" stroke-opacity="0.5"/>
<text class="hk-sans" x="123" y="320" text-anchor="middle" font-size="12" style="fill:#e6edf3">a escrita passa</text>
</g>
<g transform="translate(428,316)"><g opacity="0" style="animation:hkMark 11s linear infinite;transform-box:fill-box;transform-origin:center">
<circle r="10" fill="#d29922" fill-opacity="0.18" stroke="#d29922" stroke-opacity="0.6"/>
<path d="M0 -4.8 V1.2 M0 4 v0.2" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
</g></g>
<text class="hk-sans" x="60" y="356" font-size="11.5" style="fill:#6e7681">registra e deixa passar, com marca <tspan class="hk-mono" style="fill:#d29922">regra_violada</tspan> no rastro</text>

<!-- modo bloqueio -->
<rect x="524.5" y="204.5" width="439" height="164" rx="10" fill="#161b22" stroke="#f85149" stroke-opacity="0.45"/>
<rect x="548" y="222" width="92" height="22" rx="11" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.5"/>
<text class="hk-sans hk-cap" x="594" y="237" text-anchor="middle" style="fill:#f85149">modo bloqueio</text>
<text class="hk-sans hk-d" x="652" y="237">decisão sua, depois de semanas sem falso positivo</text>
<line x1="524" y1="256" x2="963" y2="256" stroke="#30363d"/>
<text class="hk-mono" x="548" y="282" font-size="12" style="fill:#8b949e">segredo-no-commit.py</text>
<text class="hk-sans" x="940" y="282" text-anchor="end" font-size="11.5" style="fill:#f85149">nasce em bloqueio</text>
<line x1="548" y1="316" x2="940" y2="316" stroke="#21262d" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="796" y="294" width="7" height="44" rx="3.5" fill="#f85149"/>
<g style="animation:hkTokB 11s linear infinite" opacity="0">
<rect x="548" y="302" width="136" height="28" rx="8" fill="#21262d" stroke="#f85149" stroke-opacity="0.5"/>
<text class="hk-sans" x="616" y="320" text-anchor="middle" font-size="12" style="fill:#e6edf3">a escrita é barrada</text>
</g>
<g transform="translate(844,316)"><g opacity="0" style="animation:hkMark 11s linear infinite;transform-box:fill-box;transform-origin:center">
<circle r="10" fill="#f85149" fill-opacity="0.18" stroke="#f85149" stroke-opacity="0.6"/>
<path d="M-3.6 -3.6 L3.6 3.6 M3.6 -3.6 L-3.6 3.6" stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
</g></g>
<text class="hk-sans" x="548" y="356" font-size="11.5" style="fill:#6e7681">falha fechada — a exceção é a segurança, não o método</text>

<line x1="36" y1="388" x2="964" y2="388" stroke="#21262d"/>
<text class="hk-sans hk-foot" x="36" y="412">O modo de cada hook vive em <tspan class="hk-mono" style="fill:#e6edf3">.expx/hooks.json</tspan>. Rode <tspan class="hk-mono" style="fill:#e6edf3">doctor.py</tspan> para ver em que modo cada um está e quantas vezes cada regra foi violada.</text>
</svg>
