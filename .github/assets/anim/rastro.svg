<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="O rastro de eventos: um arquivo append-only, uma linha JSON por evento, lido pelo painel de operação.">
<title>O rastro de eventos da runx: append-only, lido pelo painel de operação</title>
<style>
.rt-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
