<rect x="36.5" y="92.5" width="560" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="36.5" y="92.5" width="560" height="34" rx="10" fill="#21262d"/><rect x="36.5" y="118" width="560" height="9" fill="#21262d"/>
