<g style="animation:rtL2 16s linear infinite" opacity="0"><text class="rt-mono" x="56" y="172">{<tspan class="k">"evento"</tspan>:<tspan style="fill:#f0883e">"arquivo_alterado"</tspan>,<tspan class="k">"path"</tspan>:<tspan class="v">"src/frete/calculo.ts"</tspan>}</text></g>
<g style="animation:rtL3 16s linear infinite" opacity="0"><text class="rt-mono" x="56" y="194">{<tspan class="k">"evento"</tspan>:<tspan style="fill:#f0883e">"suite_executada"</tspan>,<tspan class="k">"res"</tspan>:<tspan style="fill:#f85149">"vermelha"</tspan>,<tspan class="k">"head"</tspan>:<tspan class="v">"a91c0f2"</tspan>}</text></g>
<g style="animation:rtL4 16s linear infinite" opacity="0"><text class="rt-mono" x="56" y="216">{<tspan class="k">"evento"</tspan>:<tspan style="fill:#f0883e">"suite_executada"</tspan>,<tspan class="k">"res"</tspan>:<tspan style="fill:#3fb950">"verde"</tspan>,<tspan class="k">"head"</tspan>:<tspan class="v">"7d4e118"</tspan>}</text></g>
<g style="animation:rtL5 16s linear infinite" opacity="0"><text class="rt-mono" x="56" y="238">{<tspan class="k">"evento"</tspan>:<tspan style="fill:#f0883e">"task_concluida"</tspan>,<tspan class="k">"id"</tspan>:<tspan class="v">"T-01.01"</tspan>,<tspan class="k">"dur_s"</tspan>:<tspan class="v">412</tspan>}</text></g>
<g style="animation:rtL6 16s linear infinite" opacity="0"><text class="rt-mono" x="56" y="260">{<tspan class="k">"evento"</tspan>:<tspan style="fill:#f0883e">"regra_violada"</tspan>,<tspan class="k">"hook"</tspan>:<tspan style="fill:#d29922">"escopo-da-ocorrencia"</tspan>}</text></g>
<g style="animation:rtL7 16s linear infinite" opacity="0"><text class="rt-mono" x="56" y="282">{<tspan class="k">"evento"</tspan>:<tspan style="fill:#f0883e">"veredito_emitido"</tspan>,<tspan class="k">"res"</tspan>:<tspan style="fill:#f85149">"REPROVADO"</tspan>}</text></g>
<rect x="56" y="292" width="7" height="14" fill="#f0883e" style="animation:rtCur 1s steps(1,end) infinite"/>

<path d="M612 205 H648" stroke="#30363d" stroke-width="2"/>
<path d="M642 199 L649 205 L642 211" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

<rect x="660.5" y="92.5" width="303" height="226" rx="10" fill="#161b22" stroke="#30363d"/>
<circle cx="684" cy="112" r="4" style="fill:#58a6ff"/>
<text class="rt-sans rt-cap" x="698" y="116" style="fill:#58a6ff">PAINEL DE OPERAÇÃO</text>
<text class="rt-mono" x="940" y="116" text-anchor="end">expxdev panel</text>
<line x1="660" y1="128.5" x2="963" y2="128.5" stroke="#30363d"/>
<text class="rt-sans" x="684" y="152" font-size="11.5" style="fill:#6e7681">duas coisas que só o rastro revela</text>

<g style="animation:rtM1 16s linear infinite" opacity="0">
<rect x="684" y="164" width="256" height="60" rx="8" fill="#21262d" stroke="#30363d"/>
<text class="rt-sans rt-big" x="704" y="196" style="fill:#f85149">2</text>
<text class="rt-sans rt-lbl" x="732" y="190">voltas ao E3 causadas pelo QA</text>
<text class="rt-sans" x="732" y="208" font-size="11" style="fill:#6e7681">plano ruim gera volta — indicador honesto</text>
</g>
<g style="animation:rtM2 16s linear infinite" opacity="0">
<rect x="684" y="236" width="256" height="60" rx="8" fill="#21262d" stroke="#30363d"/>
<text class="rt-sans rt-big" x="704" y="268" style="fill:#3fb950">6′52″</text>
<text class="rt-sans rt-lbl" x="784" y="262">duração real da T-01.01</text>
<text class="rt-sans" x="784" y="280" font-size="11" style="fill:#6e7681">sem ninguém anotar nada</text>
</g>

<line x1="36" y1="340" x2="964" y2="340" stroke="#21262d"/>
<text class="rt-sans rt-foot" x="36" y="366">Ignorado pelo versionador por padrão: é local da máquina de quem executou e cresce rápido. Acima de 5 MB rotaciona para <tspan class="rt-mono" style="fill:#e6edf3;font-size:13px">&lt;OC-ID&gt;.1.jsonl</tspan>.</text>
</svg>
