@keyframes rtL6{0%,54%{opacity:0;transform:translateY(5px)}58%,94%{opacity:1;transform:none}99%,100%{opacity:0;transform:none}}
@keyframes rtL7{0%,64%{opacity:0;transform:translateY(5px)}68%,94%{opacity:1;transform:none}99%,100%{opacity:0;transform:none}}
@keyframes rtCur{0%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes rtM1{0%,70%{opacity:0;transform:translateY(6px)}76%,94%{opacity:1;transform:none}99%,100%{opacity:0;transform:none}}
